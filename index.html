<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ivy</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0f0f0f;
      color: white;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .container {
      text-align: center;
      max-width: 600px;
      padding: 20px;
    }

    h1 {
      font-size: 56px;
      margin-bottom: 10px;
      letter-spacing: 4px;
    }

    p {
      opacity: 0.7;
      line-height: 1.8;
      font-size: 18px;
    }

    .line {
      width: 80px;
      height: 1px;
      background: white;
      margin: 30px auto;
      opacity: 0.3;
    }

    .button {
      margin-top: 30px;
      display: inline-block;
      padding: 12px 24px;
      border: 1px solid white;
      color: white;
      text-decoration: none;
      transition: 0.3s;
    }

    .button:hover {
      background: white;
      color: black;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>IVY</h1>

    <div class="line"></div>

    <p>
      A quiet corner floating in the internet.<br>
      Music, thoughts, films, and fragments of life.
    </p>

    <a class="button" href="#">
      Enter
    </a>
  </div>
</body>
</html>
